<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body class="body">
    <main class="content">
      <section class="block">
        <div class="progress-loading" id="wrapper">
          <p class="text">Progress</p>

          <svg class="loading-circle" id="circleSvg" width="120" height="120">
            <circle
              class="background-circle"
              cx="60"
              cy="60"
              r="55"
              fill="none"
              stroke="#D3D3D3"
              stroke-width="10"
            />

            <circle
              class="main-circle"
              cx="60"
              cy="60"
              r="55"
              fill="none"
              stroke="#1560BD"
              stroke-width="10"
            />
          </svg>
        </div>
      </section>

      <section class="settings">
        <div class="controls">
          <label class="setting">
            <input
              class="value-input"
              type="number"
              id="value"
              min="0"
              max="100"
              value="0"
            />
            <span class="switch-label">Value</span>
          </label>

          <label class="switch">
            <input type="checkbox" id="toggle" class="visually-hidden" />
            <span class="switch-pseudo"></span>
            <span class="switch-label">Animate</span>
          </label>

          <label class="switch">
            <input type="checkbox" id="hideToggle" class="visually-hidden" />
            <span class="switch-pseudo"></span>
            <span class="switch-label">Hide</span>
          </label>
        </div>
      </section>
    </main>
    <script src="./script.js"></script>
  </body>
</html>
